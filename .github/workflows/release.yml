name: Build and release plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          plugin_version=$(sed -nE 's/.*VERSION = \{ major=([0-9]+), minor=([0-9]+), revision=([0-9]+),.*/\1.\2.\3/p' \
            "plugin/GainMap HDR Heic Export.lrdevplugin/Info.lua")
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$plugin_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version $plugin_version." >&2
            exit 1
          fi

      - name: Ensure Metal compiler is available
        shell: bash
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            export_dir="$RUNNER_TEMP/metal-toolchain-export"
            mkdir -p "$export_dir"
            xcodebuild -downloadComponent MetalToolchain -exportPath "$export_dir"
            bundle=$(find "$export_dir" -maxdepth 1 -name '*.exportedBundle' -print -quit)
            if [[ -z "$bundle" ]]; then
              echo "Xcode did not export a Metal Toolchain bundle." >&2
              exit 1
            fi
            xcodebuild -deleteComponent MetalToolchain || true
            xcodebuild -importComponent MetalToolchain -importPath "$bundle"
          fi
          xcrun metal --version

      - name: Run converter checks and build release package
        run: make test package

      - name: Create checksum
        run: (cd build && shasum -a 256 "GainMap HDR Heic Export.lrdevplugin.zip" > SHA256SUMS.txt)

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: lightroom-gainmap-hdr-export
          path: |
            build/GainMap HDR Heic Export.lrdevplugin.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: lightroom-gainmap-hdr-export
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/GainMap HDR Heic Export.lrdevplugin.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
